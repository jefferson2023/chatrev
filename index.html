<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-[#0b141a]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bate-Papo de Suporte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    .chat-bg {
      background-color: #0b141a;
      background-image: radial-gradient(#111b21 1px, transparent 0);
      background-size: 16px 16px;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374248; border-radius: 3px; }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-gray-100 antialiased selection:bg-[#00a884] selection:text-white">

  <!-- TELA DE LOGIN -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0b141a] p-4 chat-bg">
    <div class="w-full max-w-md bg-[#111b21] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#128c7e]/20 text-[#00a884] mb-3">
          <i class="fa-brands fa-whatsapp text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-100">Bate-Papo de Suporte</h1>
        <p class="text-xs text-gray-400 mt-1">Digite seu apelido e a senha correta para conectar ao bate-papo.</p>
      </div>

      <form id="loginForm" onsubmit="handleJoin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2">APELIDO</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user text-sm"></i>
            </span>
            <input type="text" id="usernameInput" required placeholder="Digite seu apelido (Ex: Alex)"
              class="w-full pl-10 pr-4 py-3 bg-[#202c33] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[#00a884] focus:ring-1 focus:ring-[#00a884] text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2">SENHA / PIN DA SALA</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-indigo-400">
              <i class="fa-solid fa-key text-sm"></i>
            </span>
            <input type="password" id="pinInput" required placeholder="Digite a senha de acesso"
              class="w-full pl-10 pr-4 py-3 bg-[#202c33] border border-indigo-500/50 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 text-sm">
          </div>
          <p class="text-[11px] text-gray-500 mt-1">Acesso restrito por senha.</p>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-4 bg-[#008069] hover:bg-[#00a884] text-white font-medium rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg mt-2">
          <span>Entrar no Bate-Papo</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- TELA DO CHAT -->
  <div id="chatScreen" class="hidden flex-col h-full max-w-5xl w-full mx-auto bg-[#111b21] shadow-2xl overflow-hidden">
    <!-- Cabeçalho -->
    <header class="bg-[#202c33] px-4 py-3 flex items-center justify-between border-b border-gray-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[#128c7e] flex items-center justify-center text-white font-bold text-lg">
          <i class="fa-solid fa-headset text-xl"></i>
        </div>
        <div>
          <h2 class="font-semibold text-gray-100 text-base leading-tight">Sala de Suporte</h2>
          <p class="text-xs text-[#00a884] flex items-center gap-1 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-[#00a884]"></span>
            <span>Online</span>
          </p>
        </div>
      </div>
      <button onclick="leaveChat()" class="text-gray-400 hover:text-red-400 p-2 rounded-lg transition" title="Sair">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
      </button>
    </header>

    <!-- Lista de Mensagens -->
    <main id="messagesList" class="flex-1 overflow-y-auto p-4 space-y-3 chat-bg custom-scrollbar"></main>

    <!-- Barra de Envio -->
    <footer class="bg-[#202c33] p-3 border-t border-gray-800">
      <form id="messageForm" onsubmit="sendMessage(event)" class="flex items-center gap-2">
        <label class="cursor-pointer text-gray-400 hover:text-gray-200 p-2.5 rounded-full hover:bg-gray-700/50 transition">
          <i class="fa-solid fa-paperclip text-lg"></i>
          <input type="file" id="imageInput" accept="image/*" onchange="sendImage(event)" class="hidden">
        </label>
        <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off"
          class="flex-1 bg-[#2a3942] text-white placeholder-gray-400 px-4 py-2.5 rounded-full border-none focus:outline-none focus:ring-1 focus:ring-[#00a884] text-sm">
        <button type="submit" class="w-10 h-10 rounded-full bg-[#00a884] hover:bg-[#008069] text-white flex items-center justify-center transition shrink-0 shadow">
          <i class="fa-solid fa-paper-plane text-sm"></i>
        </button>
      </form>
    </footer>
  </div>

  <script>
    let currentUser = "";

    const userColors = [
      '#e52e71', '#ff8a00', '#00e676', '#1e88e5', 
      '#ab47bc', '#00e5ff', '#ffeb3b', '#ff5252', 
      '#69f0ae', '#ff4081', '#7c4dff', '#00b0ff'
    ];

    function getUserColor(username) {
      let hash = 0;
      for (let i = 0; i < username.length; i++) {
        hash = username.charCodeAt(i) + ((hash << 5) - hash);
      }
      const index = Math.abs(hash) % userColors.length;
      return userColors[index];
    }

    // Inicialização do Firebase
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyDemoConfigKeyForStaticPages12345",
        authDomain: "jtv-chat.firebaseapp.com",
        projectId: "jtv-chat",
        storageBucket: "jtv-chat.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:123456789"
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      window.db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase desativado. Usando armazenamento local.");
    }

    function handleJoin(e) {
      e.preventDefault();
      const username = document.getElementById("usernameInput").value.trim();
      const pin = document.getElementById("pinInput").value.trim();

      if (!username) return alert("Por favor, digite o seu apelido.");
      if (pin !== "jtvrevendas") return alert("Senha incorreta! Acesso negado.");

      currentUser = username;
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("chatScreen").classList.remove("hidden");
      document.getElementById("chatScreen").classList.add("flex");

      loadMessages();
    }

    function loadMessages() {
      const container = document.getElementById("messagesList");
      if (!container) return;

      if (window.db) {
        window.db.collection("messages").orderBy("timestamp", "asc")
          .onSnapshot(snapshot => {
            container.innerHTML = "";
            const cloudMessages = [];
            snapshot.forEach(doc => {
              cloudMessages.push(doc.data());
            });
            // Salva também no cache local do navegador
            localStorage.setItem("jtv_chat_history", JSON.stringify(cloudMessages));
            
            cloudMessages.forEach(msg => renderMessage(msg));
            container.scrollTop = container.scrollHeight;
          }, err => {
            loadLocalMessages();
          });
      } else {
        loadLocalMessages();
      }
    }

    function loadLocalMessages() {
      const container = document.getElementById("messagesList");
      container.innerHTML = "";
      const saved = JSON.parse(localStorage.getItem("jtv_chat_history") || "[]");
      saved.forEach(msg => renderMessage(msg));
      container.scrollTop = container.scrollHeight;
    }

    function renderMessage(msg) {
      const container = document.getElementById("messagesList");
      if (!container) return;
      const isMe = msg.sender === currentUser;
      const nameColor = getUserColor(msg.sender || "Anônimo");
      
      const div = document.createElement("div");
      div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2`;
      
      let contentHtml = msg.text ? `<p class="text-sm text-gray-100 break-words leading-relaxed">${escapeHtml(msg.text)}</p>` : '';
      if (msg.imageUrl) {
        contentHtml += `<img src="${msg.imageUrl}" class="max-w-xs rounded-lg mt-1 border border-gray-700">`;
      }

      div.innerHTML = `
        <div class="max-w-[75%] px-3 py-2 rounded-xl shadow ${isMe ? 'bg-[#005c4b] rounded-tr-none' : 'bg-[#202c33] rounded-tl-none'}">
          <p class="text-xs font-bold mb-0.5" style="color: ${nameColor}">${escapeHtml(msg.sender)}</p>
          ${contentHtml}
          <div class="text-[10px] text-gray-400 text-right mt-1 flex items-center justify-end gap-1">
            <span>${msg.time || ''}</span>
            ${isMe ? '<i class="fa-solid fa-check-double text-sky-400"></i>' : ''}
          </div>
        </div>
      `;
      container.appendChild(div);
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      const msgData = {
        sender: currentUser,
        text: text,
        timestamp: new Date().getTime(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      if (window.db) {
        window.db.collection("messages").add({
          sender: currentUser,
          text: text,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          time: msgData.time
        });
      } else {
        const saved = JSON.parse(localStorage.getItem("jtv_chat_history") || "[]");
        saved.push(msgData);
        localStorage.setItem("jtv_chat_history", JSON.stringify(saved));
        loadLocalMessages();
      }
      input.value = "";
    }

    function sendImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const msgData = {
          sender: currentUser,
          imageUrl: evt.target.result,
          timestamp: new Date().getTime(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        if (window.db) {
          window.db.collection("messages").add({
            sender: currentUser,
            imageUrl: evt.target.result,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            time: msgData.time
          });
        } else {
          const saved = JSON.parse(localStorage.getItem("jtv_chat_history") || "[]");
          saved.push(msgData);
          localStorage.setItem("jtv_chat_history", JSON.stringify(saved));
          loadLocalMessages();
        }
      };
      reader.readAsDataURL(file);
    }

    function leaveChat() {
      location.reload();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
